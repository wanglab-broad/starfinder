# Full configuration reference: one small FOV, all core mode sections, and
# disabled downstream sections. Values are illustrative, not tissue tuning.
# This is a Python template; see backend differences before using MATLAB.
config_path: /absolute/run/config.yaml
starfinder_path: /absolute/starfinder
root_input_path: /absolute/input
root_output_path: /absolute/output
envs_path: /absolute/conda-envs
fiji_path: /absolute/Fiji.app/ImageJ-linux64
dataset_id: example
sample_id: sample
output_id: full
fov_id_pattern: tile_{i}
n_fovs: 1
n_rounds: 4
ref_round: round1
ref_channel: DAPI
dapi_round: round1
rotate_angle: 0
maximum_projection: false
img_col: 32
img_row: 32
img_z: 8
voxel_size_xy: 1.0
voxel_size_z: 1.0
seq_channel_order: [ch00, ch02, ch01, ch03]
additional_round: []
backend: python
# MATLAB rules only: 'path' (STARFINDER_MATLAB_EXECUTABLE or matlab on PATH)
# or 'broad' (use Matlab on the Broad cluster); true adds -singleCompThread.
matlab_launcher: path
matlab_single_thread: false
workflow_mode: direct
subset_list: []
subset_range: false
subset_start: 1
subset_end: 1
subset_random: false
n_random_tests: 1
rules:
  rsf_single_fov:
    run: true
    resources: {mem_mb: 8000, runtime: 30}
    parameters:
      streaming: false
      enhance_contrast: {run: true}
      hist_equalize: {run: false, reference_channel: 0}
      morph_recon: {run: false, radius: 3}
      global_registration: {run: true, ref_round: round1, ref_img: merged-image, mov_img: merged-image}
      local_registration: {run: false, ref_round: round1, method: demons}
      spot_finding: {run: true, ref_round: round1, intensity_estimation: noise, intensity_threshold: 5.0}
      load_codebook: {run: true, split_index: []}
      reads_extraction: {run: true, voxel_size: [1, 2, 2]}
      reads_filtration: {run: true, end_base: CC, start_base: C, n_barcode_segments: 1, split_index: []}
  gr_single_fov_subtile:
    run: false
    resources: {mem_mb: 8000, runtime: 30}
    parameters:
      streaming: false
      enhance_contrast: {run: true}
      hist_equalize: {run: false, reference_channel: 0}
      morph_recon: {run: false, radius: 3}
      global_registration: {run: true, ref_round: round1, ref_img: merged-image, mov_img: merged-image}
      create_subtiles: {run: true, sqrt_pieces: 2}
  lrsf_single_fov_subtile:
    run: false
    resources: {mem_mb: 8000, runtime: 30}
    parameters:
      local_registration: {run: false, ref_round: round1, method: demons}
      morph_recon: {run: false, radius: 3}
      spot_finding: {run: true, ref_round: round1, intensity_estimation: noise, intensity_threshold: 5.0}
      load_codebook: {run: true, split_index: []}
      reads_extraction: {run: true, voxel_size: [1, 2, 2]}
      reads_filtration: {run: true, end_base: CC, start_base: C, n_barcode_segments: 1, split_index: []}
  deep_create_subtile:
    run: false
    resources: {mem_mb: 8000, runtime: 30}
    parameters:
      streaming: false
      hist_equalize: {run: false, reference_channel: 0}
      global_registration: {run: true, ref_round: round1, ref_img: merged-image, mov_img: merged-image}
      create_subtiles: {run: true, sqrt_pieces: 2}
  deep_rsf_subtile:
    run: false
    resources: {mem_mb: 8000, runtime: 30}
    parameters:
      morph_recon: {run: false, radius: 3}
      spot_finding: {run: true, ref_round: round1, intensity_estimation: noise, intensity_threshold: 5.0}
      load_codebook: {run: true, split_index: []}
      reads_extraction: {run: true, voxel_size: [1, 2, 2]}
      reads_filtration: {run: true, end_base: CC, start_base: C, n_barcode_segments: 1, split_index: []}
  stitch_subtile:
    run: false
    resources: {mem_mb: 8000, runtime: 5}
  nuclei_registration:
    run: false
    resources: {mem_mb: 8000}
  rotate_nuclei:
    run: false
    resources: {mem_mb: 8000}
  create_nuclei_amplicon_overlay:
    run: false
    parameters: {maximum_projection: false}
  enhance_dapi_with_flamingo:
    run: false
  stardist_segmentation:
    run: false
    resources: {mem_mb: 8000, runtime: 30}
    parameters:
      stardist_base_path: /absolute/stardist-models
      stardist_model_name: replace-with-your-trained-model
      segmentation_input_folder: overlay
      prob_thresh: 0.8
      nms_thresh: 0.1
      rescale: false
      expand_labels: false
      distance: 0
  stitching_preparation:
    run: false
  create_BigStitcher_macro:
    run: false
  run_BigStitcher_macro:
    run: false
    resources: {mem_mb: 8000, runtime: 30}
  create_tile_config:
    run: false
  reads_assignment:
    run: false
    parameters: {expand_labels: false, dilation_distance: 0}
  create_sample_h5ad:
    run: false
  create_sample_reads_assignment:
    run: false
