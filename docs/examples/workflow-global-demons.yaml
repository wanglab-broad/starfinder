# Global processing with a demons step on the whole FOV (mode direct): the
# preprocessing of workflow-global.yaml, then each round registered by a translation
# and demons on the channels' maximum, demons with its config defaults
# (DemonsConfig). No reconstruction after registration. workflow-global-demons-tiled.yaml
# runs demons in tiles instead. Its dataset keys match the synthetic fixture of
# src/python/scripts/workflow_golden.py (preset sample-tiny-v1); prepare_workflow.py
# fills in the two roots. For your data, set the roots, the identifiers, the rounds
# and the channels.
root_input_path: /absolute/input
root_output_path: /absolute/output
dataset_id: sample-tiny-v1
sample_id: sample
output_id: global-demons
# The FOVs are the rows of <root_input_path>/<dataset_id>/<sample_id>/fovs.csv
# (sample,fov_id); the optional selected_fovs list restricts a run.
n_rounds: 4
ref_round: round1
rotate_angle: 0
seq_channel_order: [ch00, ch01, ch02, ch03]
processing:
  mode: direct
  preprocessing:
    steps:
      - {method: min_max_normalization, output_dtype: uint8, output_range: [0, 255], rounding: truncate}
      - {method: histogram_matching, reference_channel: 0}
  registration:
    steps:
      - {method: translation}
      - {method: demons}
    signal: {mode: max}
  spot_finding: {method: local_maxima, exclude_border: false}
  reads_extraction: {voxel_size: [1, 2, 2]}
  reads_filtration: {end_base: CC, start_base: C}
  decoding: {method: wta, negative_policy: clip_negative}
execution:
  # One thread per fov task (the default is 4): Nextflow's local executor refuses a
  # task that requests more CPUs than the machine has.
  tasks:
    fov: {threads: 1}
