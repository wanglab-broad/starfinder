# Recipe 2 on the Python backend: scalar background subtraction, kept as the
# snapshot bg_corrected, then percentile normalization. Detection and
# registration use the normalized (detection) image; extraction reads the
# background-corrected snapshot before normalization. The preprocessing key
# replaces enhance_contrast, hist_equalize, morph_recon and tophat, which must
# be absent. Parameter values are the provisional defaults, not tissue tuning.
config_path: /absolute/run/config.yaml
starfinder_path: /absolute/starfinder
root_input_path: /absolute/input
root_output_path: /absolute/output
envs_path: /absolute/conda-envs
fiji_path: /absolute/Fiji.app/ImageJ-linux64
dataset_id: example
sample_id: sample
output_id: recipe2
# The FOVs are the rows of <root_input_path>/<dataset_id>/<sample_id>/fovs.csv
# (sample,fov_id); the optional selected_fovs list restricts a run.
n_rounds: 4
ref_round: round1
rotate_angle: 0
img_col: 32
img_row: 32
backend: python
workflow_mode: direct
additional_round: []
seq_channel_order: [ch00, ch02, ch01, ch03]
rules:
  rsf_single_fov:
    run: true
    parameters:
      preprocessing:
        steps:
          - method: scalar_background
            percentile: 10.0
            save_as: bg_corrected
          - method: percentile_normalization
            p_low: 1.0
            p_high: 99.9
        extraction_source: bg_corrected
      global_registration: {run: true}
      spot_finding: {run: true, intensity_estimation: noise, intensity_threshold: 5.0}
      reads_extraction: {run: true, voxel_size: [1, 2, 2]}
      reads_filtration: {run: true, end_base: CC, start_base: C}
