# Recipe 2 in the processing block: scalar background subtraction, kept as the
# snapshot bg_corrected, then percentile normalization. Detection and
# registration use the normalized (detection) image; extraction reads the
# background-corrected snapshot before normalization. Parameter values are the
# provisional defaults, not tissue tuning. prepare_workflow.py fills in the two roots.
root_input_path: /absolute/input
root_output_path: /absolute/output
dataset_id: sample-tiny-v1
sample_id: sample
output_id: recipe2
# The FOVs are the rows of <root_input_path>/<dataset_id>/<sample_id>/fovs.csv
# (sample,fov_id); the optional selected_fovs list restricts a run.
n_rounds: 4
ref_round: round1
rotate_angle: 0
seq_channel_order: [ch00, ch01, ch02, ch03]
processing:
  preprocessing:
    steps:
      - method: scalar_background
        percentile: 10.0
        save_as: bg_corrected
      - method: percentile_normalization
        p_low: 1.0
        p_high: 99.9
    extraction_source: bg_corrected
  registration:
    steps:
      - {method: translation}
  spot_finding: {threshold_mode: noise, threshold_value: 5.0}
  reads_extraction: {voxel_size: [1, 2, 2]}
  reads_filtration: {end_base: CC, start_base: C}
