# The minimal workflow configuration: the processing block alone, one fov task per FOV.
# Its dataset keys match the synthetic fixture of src/python/scripts/workflow_golden.py
# (preset sample-tiny-v1); prepare_workflow.py fills in the two roots. For your data, set
# the roots, the identifiers, the rounds and the channels.
root_input_path: /absolute/input
root_output_path: /absolute/output
dataset_id: sample-tiny-v1
sample_id: sample
output_id: minimal
# The FOVs are the rows of <root_input_path>/<dataset_id>/<sample_id>/fovs.csv
# (sample,fov_id); the optional selected_fovs list restricts a run.
n_rounds: 4
ref_round: round1
rotate_angle: 0
seq_channel_order: [ch00, ch01, ch02, ch03]
processing:
  registration:
    steps:
      - {method: translation}
  spot_finding: {method: local_maxima, exclude_border: false}
  reads_extraction: {voxel_size: [1, 2, 2]}
  reads_filtration: {end_base: CC, start_base: C}
  decoding: {method: wta, negative_policy: clip_negative}
execution:
  # One thread per fov task (the default is 4): Nextflow's local executor refuses a
  # task that requests more CPUs than the machine has.
  tasks:
    fov: {threads: 1}
