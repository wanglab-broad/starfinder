  # ==================== Segmentation and assignment blocks (Python only) ====================
  # docs/segmentation-contract.md and docs/assignment-contract.md, "Workflow configuration".
  segmentation_block:
    description: >-
      Python only. A segmentation plan of named runs for FOV.segment, run by the §2.13 rule;
      the stardist_segmentation rule translates its own legacy keys instead and raises when
      this block is present.
    type: object
    required: [runs]
    properties:
      device:
        description: "The device of the segment calls: cpu (default) or cuda"
        enum: ["cpu", "cuda"]
      runs:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/segmentation_run"
    additionalProperties: false

  segmentation_run:
    description: >-
      One run. Keys besides name, target, inputs, seeds, projection, operations and method are
      the init fields of the method's config (or of LabelImportConfig with method import); the
      Python adapter validates them.
    type: object
    required: [name, target, method]
    properties:
      name:
        type: string
      target:
        enum: ["nucleus", "cell"]
      inputs:
        type: array
        items:
          $ref: "#/$defs/segmentation_input"
      seeds:
        description: "The name of an earlier nucleus run whose labels seed this one"
        type: string
      projection:
        description: "true (ProjectionConfig()) or a mapping of ProjectionConfig fields; a Z projection of the input"
        type: [boolean, object]
      operations:
        type: array
        items:
          type: object
          required: [operation]
          properties:
            operation:
              enum: ["expand_labels", "extend_labels_through_z"]
          additionalProperties: true
      method:
        description: "A SEGMENTATION_METHODS name (the first list, kept equal to the registry by a test), or import"
        anyOf:
          - enum: ["stardist", "cellpose", "seeded_watershed"]
          - const: import
    additionalProperties: true

  segmentation_input:
    description: "InputChannel fields; prepare names composite_nuclei_amplicon or enhance_with_flamingo with its config fields"
    type: object
    required: [role]
    properties:
      role:
        enum: ["nuclear", "cytoplasm", "membrane", "amplicon", "composite"]
      round:
        type: string
      channel:
        type: [string, integer]
      reference_merged:
        type: boolean
      prepare:
        type: object
        required: [function]
        properties:
          function:
            enum: ["composite_nuclei_amplicon", "enhance_with_flamingo"]
        additionalProperties: true
      prepare_channel:
        type: [string, integer]
    additionalProperties: false

  assignment_block:
    description: >-
      Python only. The call of FOV.assign_molecules, run by the §2.13 rule: the AssignmentConfig
      fields and the FOV.assign_molecules arguments (keys kept equal to them by a test); the
      reads_assignment rule translates its own legacy keys instead and raises when this block
      is present.
    type: object
    properties:
      cells:
        description: "The segmentation run whose labels are the cell territories"
        type: string
      nuclei:
        description: "The nucleus run, or null"
        type: [string, "null"]
      name:
        type: string
      population:
        enum: ["final", "called"]
      expansion:
        description: "ExpandLabelsConfig fields, or null for no expansion"
        type: [object, "null"]
        required: [distance, unit, mode]
        properties:
          distance:
            type: number
            minimum: 0
          unit:
            enum: ["pixel", "um"]
          mode:
            enum: ["planar", "volumetric"]
        additionalProperties: false
      legacy_pixel_expansion:
        type: boolean
      correspondence:
        description: "CorrespondenceConfig fields (a supplied correspondence table is not a YAML value)"
        type: object
        properties:
          match_fraction:
            type: number
            default: 0.5
          outside_tolerance:
            description: "Share of a matched nucleus allowed outside its cell (option C2, provisional)"
            type: number
            default: 0.1
        additionalProperties: false
      exclude_cells_without_nucleus:
        type: [boolean, "null"]
      checkpoints:
        description: "CheckpointConfig fields, or null"
        type: [object, "null"]
    additionalProperties: false

  # ==================== Stitching, assembly and export blocks (Python only) ====================
  # docs/stitching-contract.md, docs/assembly-contract.md and docs/sample-output-contract.md,
  # "Workflow configuration". Tests keep the method names, the assembly keys and the export keys
  # equal to STITCHING_METHODS plus bigstitcher, AssemblyConfig and ExportConfig.
  stitching_block:
    description: >-
      Python only. The per-sample placement: Dataset.stitch for an in-process method, or the
      BigStitcher macro, engine and import rules for bigstitcher; without the block the four legacy
      stitching rules run unchanged.
    type: object
    required: [positions]
    properties:
      method:
        description: "A STITCHING_METHODS name (kept equal to the registry by a test), or bigstitcher (the default)"
        enum: ["multiview_stitcher", "bigstitcher"]
        default: "bigstitcher"
      input:
        description: "reference_merged (default), reference_stain, or file:<pattern> with {fovID}"
        anyOf:
          - enum: ["reference_merged", "reference_stain"]
          - type: string
            pattern: "^file:.+"
      positions:
        $ref: "#/$defs/stitching_positions"
      config:
        description: "Fields of MultiviewStitcherConfig or BigStitcherConfig; the Python adapter validates them"
        type: object
      review:
        description: "ReviewPolicy fields"
        type: object
        properties:
          max_correction_fraction:
            type: number
            minimum: 0
          max_residual_um:
            type: number
            minimum: 0
        additionalProperties: false
      fallback:
        description: "null (default) or nominal; for multiview_stitcher and the BigStitcher import alike"
        enum: [null, "nominal"]
      bigstitcher_save_dir:
        description: "A local folder for BigStitcher's tiles, macro and dataset.xml; required with method bigstitcher"
        type: [string, "null"]
    additionalProperties: false

  stitching_positions:
    description: >-
      The positions mapping of Dataset.stitch; stage_axes and stage_file are required with source
      stage_file (with the position_id column of fovs.csv), table with source table
    type: object
    required: [source]
    allOf:
      - if:
          properties:
            source:
              const: stage_file
        then:
          required: [stage_axes, stage_file]
      - if:
          properties:
            source:
              const: table
        then:
          required: [table]
    properties:
      source:
        enum: ["stage_file", "regular_grid", "table"]
      stage_axes:
        type: object
        required: [x, y]
        properties:
          x:
            enum: ["+x", "-x", "+y", "-y"]
          y:
            enum: ["+x", "-x", "+y", "-y"]
        additionalProperties: false
      snap_to_grid:
        type: [object, "null"]
        required: [overlap]
        properties:
          overlap:
            type: [number, array]
        additionalProperties: false
      regular_grid:
        type: object
        required: [columns, rows, order, overlap]
        properties:
          columns:
            type: integer
            minimum: 1
          rows:
            type: integer
            minimum: 1
          order:
            enum: ["column_major_down_right", "column_major_down_right_serpentine", "row_major_right_down",
                   "row_major_right_down_serpentine"]
          overlap:
            type: [number, array]
        additionalProperties: false
      tile_shape_yx:
        type: [array, "null"]
        items:
          type: integer
          minimum: 1
        minItems: 2
        maxItems: 2
      spacing_yx:
        type: [array, "null"]
        items:
          type: number
        minItems: 2
        maxItems: 2
      table:
        description: "A CSV path with source table"
        type: [string, "null"]
      unit:
        description: "The unit of the table (µm, um, nm or mm)"
        type: string
      stage_file:
        description: "The stage file's path, required with source stage_file (no default); it may hold other samples' positions"
        type: [string, "null"]
    additionalProperties: false

  assembly_block:
    description: >-
      Python only, with a stitching block. The assemble part of Dataset.export, run by the
      export_sample rule: the AssemblyConfig fields, the assignment name of Dataset.export and its
      table_format (keys kept equal to them by a test), and previews. With the block, reads_assignment
      saves each FOV's assignment folder alone (with assignment null, it writes the per-FOV files
      without the legacy filter), stitch_sample writes no tile_config_{sample}.csv, and
      create_sample_h5ad and create_sample_reads_assignment do not run.
    type: object
    properties:
      assignment:
        description: "The assignment name read per FOV (default default); null: molecules only"
        type: [string, "null"]
      previews:
        description: >-
          The assignment previews (default false): with an assignment name, reads_assignment draws each
          FOV's figures into fovs/<fov>/previews/ and export_sample its ownership figures into
          export/<sample>/previews/<fov>/
        type: boolean
      ownership:
        enum: ["nearest_center", "midpoint_box"]
      centroid:
        enum: ["territory", "original"]
      tie:
        enum: ["table_order", "half_open"]
      conflicts:
        type: boolean
      duplicate_threshold:
        description: >-
          The duplicate rule (default 0.5): two retained cells of different FOVs whose territories
          share at least this share of the smaller one are one cell, and the smaller observation is
          excluded; null turns the rule off
        type: [number, "null"]
        exclusiveMinimum: 0
        maximum: 1
      table_format:
        enum: ["csv", "parquet"]
    additionalProperties: false

  export_block:
    description: >-
      Python only, with an assembly block. The parts of Dataset.export and their settings, run by the
      export_sample rule; without the block the defaults apply (keys kept equal to ExportConfig,
      FusionConfig, LabelConfig and SpatialDataExportConfig by a test).
    type: object
    properties:
      assemble:
        type: boolean
      fuse:
        type: boolean
      fuse_labels:
        type: boolean
      export_spatialdata:
        type: boolean
      images:
        description: "Source-image names: reference_stain, reference_merged or <name>=file:<pattern>"
        type: array
        minItems: 1
        items:
          type: string
      dimensionality:
        enum: ["projection", "stack", "both"]
      projection:
        enum: ["max", "sum"]
      scale_yx:
        type: number
        exclusiveMinimum: 0
        maximum: 1
      ome_zarr:
        type: boolean
      ome_zarr_version:
        enum: ["0.5", "0.4"]
      pyramid_levels:
        type: integer
        minimum: 0
      labels_scale_yx:
        type: number
        exclusiveMinimum: 0
        maximum: 1
      spatialdata_zarr_format:
        enum: [3, 2]
      route:
        description: "per_fov or after_fusion; null: by dimensionality (projection: after_fusion; stack, both: per_fov)"
        enum: ["per_fov", "after_fusion", null]
      segment:
        description: "The part segment of the route after fusion; false reuses the saved sample segmentation"
        type: boolean
      segmentation:
        description: >-
          The segmentation of the fused projection on the route after fusion (SampleSegmentationConfig):
          device, cells, nuclei and runs, each with name, target, inputs ({role, image}), seeds and method,
          whose config fields are the run's other keys (pixel lengths of the acquired grid)
        type: ["object", "null"]
        properties:
          device:
            enum: ["cpu", "cuda"]
          cells:
            type: string
          nuclei:
            type: ["string", "null"]
          runs:
            type: array
            minItems: 1
            items:
              description: >-
                One run. Keys besides name, target, inputs, seeds and method are the init fields of the
                method's config (or of LabelImportConfig with method import); the Python adapter validates them.
              type: object
              required: [name, target, method]
              properties:
                name:
                  type: string
                target:
                  enum: ["nucleus", "cell"]
                inputs:
                  type: array
                  items:
                    type: object
                    required: [role, image]
                    properties:
                      role:
                        enum: ["nuclear", "cytoplasm", "membrane", "amplicon", "composite"]
                      image:
                        description: "An image name of export.images"
                        type: string
                    additionalProperties: false
                seeds:
                  type: ["string", "null"]
                method:
                  description: "A SEGMENTATION_METHODS name (the first list, kept equal to the registry by a test), or import"
                  anyOf:
                    - enum: ["stardist", "cellpose", "seeded_watershed"]
                    - const: import
              additionalProperties: true
        additionalProperties: false
    additionalProperties: false

  report_block:
    description: >-
      Python only. The processing report (docs/report-contract.md, "Workflow configuration"): the
      ReportConfig fields (keys kept equal to ReportConfig, MarkerGroup, ReportLimits and RuleLimit by a
      test). With the block, report_sample writes report/{sample}/ after the sample's last per-sample
      output and report_dataset writes report/index.html and report/samples.csv; an empty block gives
      the defaults.
    type: object
    properties:
      markers:
        description: "Groups of one to four genes, each one figure of the marker patterns (MarkerGroup)"
        type: array
        items:
          type: object
          required: [name, genes]
          properties:
            name:
              type: string
              minLength: 1
            genes:
              type: array
              minItems: 1
              maxItems: 4
              uniqueItems: true
              items:
                type: string
                minLength: 1
          additionalProperties: false
      marker_pairs:
        description: "Pairs of two distinct genes for MECR; none makes MECR unavailable"
        type: array
        items:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            minLength: 1
      positive_threshold:
        description: "The whole count at which a cell is positive for a gene (default 1)"
        type: integer
        minimum: 1
      example_fovs:
        description: "Three distinct FOV IDs; null (default): the automatic choice"
        type: ["array", "null"]
        minItems: 3
        maxItems: 3
        uniqueItems: true
        items:
          type: string
          minLength: 1
      limits:
        description: "The limits of the problematic-FOV rules (ReportLimits); an omitted rule keeps its default"
        type: object
        properties:
          shift_residual:
            $ref: "#/$defs/report_rule_limit"
          alignment_score:
            $ref: "#/$defs/report_rule_limit"
          correct_form_fraction:
            $ref: "#/$defs/report_rule_limit"
          matched_fraction:
            $ref: "#/$defs/report_rule_limit"
          spots_near_zero:
            description: "A spot count below this share of the sample median (default 0.05)"
            type: number
            exclusiveMinimum: 0
            exclusiveMaximum: 1
        additionalProperties: false
      figure_width_px:
        description: "The width of the whole-sample figures (default 1600)"
        type: integer
        minimum: 1
      jpeg_quality:
        description: "The JPEG quality of the whole-sample figures (default 85)"
        type: integer
        minimum: 1
        maximum: 95
    additionalProperties: false

  report_rule_limit:
    description: >-
      The limit of one problematic-FOV rule (RuleLimit): absolute alone, or k and floor (a deviation from
      the sample median larger than max(k * 1.4826 * MAD, floor)); an omitted key is null, all three null
      leave the rule unevaluated
    type: object
    properties:
      k:
        type: ["number", "null"]
        minimum: 0
      floor:
        type: ["number", "null"]
        minimum: 0
      absolute:
        type: ["number", "null"]
        minimum: 0
    additionalProperties: false
