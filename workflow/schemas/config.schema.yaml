# JSON Schema for STARfinder configuration files
# Validates config at pipeline startup to catch errors early

$schema: "https://json-schema.org/draft/2020-12/schema"
description: "STARfinder pipeline configuration schema"

type: object
required:
  - config_path
  - starfinder_path
  - root_input_path
  - root_output_path
  - dataset_id
  - sample_id
  - output_id
  - fov_id_pattern
  - n_fovs
  - n_rounds
  - ref_round
  - rotate_angle
  - img_col
  - img_row
  - rules

properties:
  # ==================== Path Configuration ====================
  config_path:
    type: string
    description: "Absolute path to this config file"

  envs_path:
    type: string
    description: "Path to conda environments directory"

  starfinder_path:
    type: string
    description: "Path to STARfinder repository root"

  fiji_path:
    type: string
    description: "Path to Fiji/ImageJ executable"

  root_input_path:
    type: string
    description: "Root directory for input data"

  root_output_path:
    type: string
    description: "Root directory for output data"

  # ==================== Dataset Metadata ====================
  dataset_id:
    type: string
    description: "Dataset identifier"

  sample_id:
    type: string
    description: "Sample identifier within dataset"

  output_id:
    type: string
    description: "Output folder identifier"

  fov_id_pattern:
    type: string
    description: "Pattern for FOV naming (e.g., 'tile_{i}' or 'Position{i:03}')"

  n_fovs:
    type: integer
    minimum: 1
    description: "Total number of FOVs in the dataset"

  n_rounds:
    type: integer
    minimum: 1
    description: "Number of sequencing rounds"

  ref_round:
    type: string
    description: "Reference round for registration (e.g., 'round1')"

  ref_channel:
    type: string
    description: "Reference channel for registration"

  dapi_round:
    type: string
    description: "Round containing DAPI images"

  rotate_angle:
    type: number
    description: "Rotation angle for image alignment (degrees)"

  # ==================== Image Dimensions ====================
  img_col:
    type: integer
    minimum: 1
    description: "Image width in pixels"

  img_row:
    type: integer
    minimum: 1
    description: "Image height in pixels"

  img_z:
    type: integer
    minimum: 1
    description: "Number of z-slices (for 3D data)"

  voxel_size_xy:
    type: number
    exclusiveMinimum: 0
    description: "XY pixel size in microns"

  voxel_size_z:
    type: number
    exclusiveMinimum: 0
    description: "Z step size in microns"

  maximum_projection:
    type: boolean
    default: false
    description: "Whether to use maximum intensity projection for 2D analysis"

  # ==================== Channel Configuration ====================
  seq_channel_order:
    type: array
    items:
      type: string
    description: "Custom sequencing channel order (empty for default)"

  additional_round:
    type: array
    items:
      type: object
      properties:
        round_name:
          type: string
    description: "Additional imaging rounds beyond sequencing"

  # ==================== Backend Selection ====================
  backend:
    type: string
    enum: ["python", "matlab"]
    default: "matlab"
    description: "Processing backend for registration and spot finding"

  matlab_launcher:
    type: string
    enum: ["path", "broad"]
    default: "path"
    description: "MATLAB invocation: 'path' uses STARFINDER_MATLAB_EXECUTABLE or matlab on PATH; 'broad' loads 'use Matlab' first"

  matlab_single_thread:
    type: boolean
    default: false
    description: "Start MATLAB with -singleCompThread"

  # ==================== Workflow Mode ====================
  workflow_mode:
    type: string
    enum: ["free", "direct", "subtile", "deep"]
    default: "free"
    description: |
      Workflow mode:
      - 'free': Mix and match rules using individual run flags
      - 'direct': Single FOV processing via rsf_single_fov
      - 'subtile': Subtile-based workflow (gr → lrsf → stitch)
      - 'deep': Deep-tissue optimized workflow

  # ==================== Subsetting Options ====================
  subset_list:
    type: array
    items:
      type: integer
      minimum: 1
    description: "Explicit list of FOV indices to process"

  subset_range:
    type: boolean
    default: false
    description: "Enable range-based subsetting"

  subset_start:
    type: integer
    minimum: 1
    description: "Start FOV index for range subsetting"

  subset_end:
    type: integer
    minimum: 1
    description: "End FOV index for range subsetting"

  subset_random:
    type: boolean
    default: false
    description: "Enable random subsetting"

  n_random_tests:
    type: integer
    minimum: 1
    description: "Number of random FOVs to select"

  # ==================== Rules Configuration ====================
  rules:
    type: object
    description: "Per-rule configuration"
    additionalProperties: false
    properties:
      rsf_single_fov:
        $ref: "#/$defs/rsf_single_fov_config"

      rsf_single_fov_seq:
        $ref: "#/$defs/rule_with_resources"

      gr_single_fov_subtile:
        $ref: "#/$defs/gr_single_fov_subtile_config"

      lrsf_single_fov_subtile:
        $ref: "#/$defs/lrsf_single_fov_subtile_config"

      deep_create_subtile:
        $ref: "#/$defs/deep_create_subtile_config"

      deep_rsf_subtile:
        $ref: "#/$defs/deep_rsf_subtile_config"

      stitch_subtile:
        $ref: "#/$defs/rule_with_resources"

      nuclei_registration:
        $ref: "#/$defs/rule_with_resources"

      rotate_nuclei:
        $ref: "#/$defs/rule_with_resources"

      create_nuclei_amplicon_overlay:
        $ref: "#/$defs/create_nuclei_amplicon_overlay_config"

      enhance_dapi_with_flamingo:
        $ref: "#/$defs/rule_with_resources"

      stardist_segmentation:
        $ref: "#/$defs/stardist_segmentation_config"

      stitching_preparation:
        $ref: "#/$defs/rule_with_resources"

      create_BigStitcher_macro:
        $ref: "#/$defs/rule_with_resources"

      run_BigStitcher_macro:
        $ref: "#/$defs/rule_with_resources"

      create_tile_config:
        $ref: "#/$defs/rule_with_resources"

      reads_assignment:
        $ref: "#/$defs/reads_assignment_config"

      create_sample_h5ad:
        $ref: "#/$defs/rule_with_resources"

      create_sample_reads_assignment:
        $ref: "#/$defs/rule_with_resources"

# ==================== Conditional Validation ====================
dependentRequired:
  subset_range:
    - subset_start
    - subset_end
  subset_random:
    - n_random_tests

allOf:
  # If subset_range is true, require subset_start and subset_end
  - if:
      properties:
        subset_range:
          const: true
    then:
      required:
        - subset_start
        - subset_end

  # If subset_random is true, require n_random_tests
  - if:
      properties:
        subset_random:
          const: true
    then:
      required:
        - n_random_tests

  # The explicit preprocessing and registration recipes, the spot-finding method and channel
  # overrides and the execution device are Python-only (backend defaults to matlab)
  - if:
      not:
        required: [backend]
        properties:
          backend:
            const: python
    then:
      properties:
        rules:
          additionalProperties:
            properties:
              parameters:
                not:
                  anyOf:
                    - required: [preprocessing]
                    - required: [registration]
                    - required: [device]
                    - required: [spot_finding]
                      properties:
                        spot_finding:
                          anyOf:
                            - required: [method]
                            - required: [channel_overrides]

# ==================== Reusable Definitions ====================
$defs:
  # Base resources schema
  resources:
    type: object
    properties:
      mem_mb:
        type: integer
        minimum: 1000
        default: 8000
        description: "Memory in MB"
      runtime:
        type: integer
        minimum: 1
        default: 30
        description: "Runtime in minutes"
    additionalProperties: false

  # Base rule with just run flag and resources
  rule_with_resources:
    type: object
    required:
      - run
    properties:
      run:
        type: boolean
        description: "Whether to run this rule"
      resources:
        $ref: "#/$defs/resources"
    additionalProperties: true

  # ==================== Parameter Definitions ====================
  enhance_contrast_params:
    type: object
    properties:
      run:
        type: boolean
    additionalProperties: true

  hist_equalize_params:
    type: object
    properties:
      run:
        type: boolean
      reference_channel:
        type: integer
    additionalProperties: true

  morph_recon_params:
    type: object
    properties:
      run:
        type: boolean
      radius:
        type: integer
        minimum: 1
    additionalProperties: true

  tophat_params:
    description: "Python-only white top-hat per XY slice; maps to TophatConfig(radius_yx=radius)"
    type: object
    properties:
      run:
        type: boolean
      radius:
        type: integer
        minimum: 1
    additionalProperties: false

  # ==================== Explicit preprocessing recipe (Python only) ====================
  # One definition per step registered in starfinder.preprocessing.PREPROCESSING_METHODS. Keys other
  # than method and save_as are the fields of the step's config dataclass; a
  # default-tier test keeps these definitions equal to PREPROCESSING_METHODS.
  snapshot_name:
    type: string
    pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
    not:
      const: detection

  preprocessing_fit:
    type: string
    enum: ["fov", "supplied"]

  preprocessing_rounding:
    type: string
    enum: ["truncate", "nearest_even"]

  preprocessing_step_min_max_normalization:
    type: object
    required: [method, output_dtype, output_range]
    additionalProperties: false
    properties:
      method: {const: min_max_normalization}
      save_as: {$ref: "#/$defs/snapshot_name"}
      output_dtype: {type: string}
      output_range:
        type: array
        items: {type: number}
        minItems: 2
        maxItems: 2
      scope: {type: string, enum: ["per_channel", "global"]}
      snr_threshold: {type: ["number", "null"], minimum: 0}
      rounding: {$ref: "#/$defs/preprocessing_rounding"}

  preprocessing_step_histogram_matching:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: histogram_matching}
      save_as: {$ref: "#/$defs/snapshot_name"}
      output_dtype: {type: ["string", "null"]}
      rounding: {$ref: "#/$defs/preprocessing_rounding"}
      reference_channel: {type: integer, minimum: 0}
      fit: {$ref: "#/$defs/preprocessing_fit"}

  preprocessing_step_reconstruction:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: reconstruction}
      save_as: {$ref: "#/$defs/snapshot_name"}
      radius_yx: {type: integer, minimum: 1}

  preprocessing_step_white_tophat:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: white_tophat}
      save_as: {$ref: "#/$defs/snapshot_name"}
      radius_yx: {type: integer, minimum: 1}

  preprocessing_step_scalar_background:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: scalar_background}
      save_as: {$ref: "#/$defs/snapshot_name"}
      percentile: {type: number, minimum: 0, exclusiveMaximum: 100}
      fit: {$ref: "#/$defs/preprocessing_fit"}

  preprocessing_step_background_3d:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: background_3d}
      save_as: {$ref: "#/$defs/snapshot_name"}
      radius_um_zyx:
        type: array
        items: {type: number, minimum: 0}
        minItems: 3
        maxItems: 3
      radius_voxels_zyx:
        type: array
        items: {type: integer, minimum: 0}
        minItems: 3
        maxItems: 3

  preprocessing_step_percentile_normalization:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: percentile_normalization}
      save_as: {$ref: "#/$defs/snapshot_name"}
      p_low: {type: number, minimum: 0, maximum: 100}
      p_high: {type: number, minimum: 0, maximum: 100}
      fit: {$ref: "#/$defs/preprocessing_fit"}

  preprocessing_params:
    description: "Python-only explicit recipe (preprocessing contract, Explicit step list); mutually exclusive with enhance_contrast, hist_equalize, morph_recon, tophat and snr_threshold"
    type: object
    required: [steps]
    additionalProperties: false
    properties:
      steps:
        type: array
        items:
          oneOf:
            - $ref: "#/$defs/preprocessing_step_min_max_normalization"
            - $ref: "#/$defs/preprocessing_step_histogram_matching"
            - $ref: "#/$defs/preprocessing_step_reconstruction"
            - $ref: "#/$defs/preprocessing_step_white_tophat"
            - $ref: "#/$defs/preprocessing_step_scalar_background"
            - $ref: "#/$defs/preprocessing_step_background_3d"
            - $ref: "#/$defs/preprocessing_step_percentile_normalization"
      extraction_source:
        oneOf: [{$ref: "#/$defs/snapshot_name"}, {type: "null"}]
      registration_source:
        oneOf: [{$ref: "#/$defs/snapshot_name"}, {type: "null"}]
      supplied_statistics: {type: ["string", "null"]}

  # ==================== Explicit registration recipe (Python only) ====================
  # One definition per method registered in starfinder.registration.REGISTRATION_METHODS. Keys
  # other than method, recovery and signal are the fields of the method's config dataclass; a
  # default-tier test keeps these definitions, and the signal, warp and qc definitions, equal to
  # REGISTRATION_METHODS and the config dataclasses.
  registration_channel:
    oneOf:
      - {type: integer, minimum: 0}
      - {type: string, minLength: 1}
      - {type: "null"}

  registration_signal:
    type: object
    additionalProperties: false
    properties:
      mode: {type: string, enum: ["max", "sum", "channel"]}
      reference_channel: {$ref: "#/$defs/registration_channel"}
      moving_channel: {$ref: "#/$defs/registration_channel"}

  registration_warp:
    type: object
    additionalProperties: false
    properties:
      backend: {type: string, enum: ["translation", "scipy", "simpleitk"]}
      boundary_mode: {type: string, enum: ["constant", "nearest"]}
      fill_value: {type: number}
      output_dtype: {type: string, enum: ["input", "float32", "float64"]}
      integer_rounding: {type: string, enum: ["nearest_even"]}
      clip_to_dtype: {const: true}
      fft_workers: {type: integer, minimum: 1}

  registration_qc:
    type: object
    additionalProperties: false
    properties:
      min_coverage: {type: ["number", "null"], minimum: 0, maximum: 1}
      min_ncc_gain: {type: ["number", "null"]}
      max_fold_fraction: {type: ["number", "null"], minimum: 0, maximum: 1}
      max_translation_voxels: {type: ["number", "null"], minimum: 0}
      projections: {type: boolean}

  registration_step_recovery:
    description: "Opt-in recovery; alternatives name methods of the step's kind and configure estimators only"
    type: object
    required: [allowed_errors, alternatives]
    additionalProperties: false
    properties:
      allowed_errors:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum: [RegistrationEstimationError, InsufficientLandmarksError, RegistrationRejectedError]
      alternatives:
        type: array
        minItems: 1
        items:
          type: object
          required: [method]
          not:
            anyOf:
              - required: [recovery]
              - required: [signal]

  registration_elastix_levels:
    type: ["integer", "null"]
    minimum: 1

  registration_interpolation_order:
    type: integer
    minimum: 0
    maximum: 5

  registration_step_translation:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: translation}
      recovery: {$ref: "#/$defs/registration_step_recovery"}
      signal: {$ref: "#/$defs/registration_signal"}
      backend: {type: string, enum: ["scipy_fft", "skimage"]}
      fft_workers: {type: integer, minimum: 1}

  registration_step_rigid:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: rigid}
      recovery: {$ref: "#/$defs/registration_step_recovery"}
      signal: {$ref: "#/$defs/registration_signal"}
      metric: {type: string, enum: ["mattes", "ncc"]}
      histogram_bins: {type: integer, minimum: 2}
      iterations: {type: integer, minimum: 1}
      samples: {type: integer, minimum: 1}
      levels: {$ref: "#/$defs/registration_elastix_levels"}
      random_seed: {type: integer, minimum: 0}

  registration_step_affine:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: affine}
      recovery: {$ref: "#/$defs/registration_step_recovery"}
      signal: {$ref: "#/$defs/registration_signal"}
      metric: {type: string, enum: ["ncc", "mattes"]}
      iterations: {type: integer, minimum: 1}
      samples: {type: integer, minimum: 1}
      levels: {$ref: "#/$defs/registration_elastix_levels"}
      random_seed: {type: integer, minimum: 0}

  registration_step_bspline:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: bspline}
      recovery: {$ref: "#/$defs/registration_step_recovery"}
      signal: {$ref: "#/$defs/registration_signal"}
      metric: {type: string, enum: ["ncc", "mattes"]}
      grid_spacing_physical: {type: ["number", "null"], exclusiveMinimum: 0}
      iterations: {type: integer, minimum: 1}
      samples: {type: integer, minimum: 1}
      levels: {$ref: "#/$defs/registration_elastix_levels"}
      random_seed: {type: integer, minimum: 0}

  registration_step_demons:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: demons}
      recovery: {$ref: "#/$defs/registration_step_recovery"}
      signal: {$ref: "#/$defs/registration_signal"}
      variant: {type: string, enum: ["demons", "diffeomorphic", "symmetric", "fast_symmetric"]}
      iterations:
        type: array
        minItems: 1
        items: {type: integer, minimum: 1}
      smoothing_sigma: {type: number, minimum: 0}
      pyramid_mode: {type: string, enum: ["antialias", "sitk"]}

  registration_step_tps:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: tps}
      recovery: {$ref: "#/$defs/registration_step_recovery"}
      signal: {$ref: "#/$defs/registration_signal"}
      detection_noise_sigma: {type: number, minimum: 0}
      match_distance_voxels: {type: number, exclusiveMinimum: 0}
      min_matches: {type: integer, minimum: 4}
      max_control_points: {type: integer, minimum: 4}
      smoothing: {type: number, minimum: 0}
      grid_spacing_voxels: {type: integer, minimum: 1}
      interpolation_order: {$ref: "#/$defs/registration_interpolation_order"}
      field_smoothing_sigma: {type: ["number", "null"], minimum: 0}
      clamp_sampling_coordinates: {type: boolean}

  registration_step_cpd:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: cpd}
      recovery: {$ref: "#/$defs/registration_step_recovery"}
      signal: {$ref: "#/$defs/registration_signal"}
      detection_noise_sigma: {type: number, minimum: 0}
      max_control_points: {type: integer, minimum: 4}
      kernel_width_voxels: {type: ["number", "null"], exclusiveMinimum: 0}
      regularization_weight: {type: number, exclusiveMinimum: 0}
      outlier_fraction: {type: number, minimum: 0, exclusiveMaximum: 1}
      affine_first: {type: boolean}
      grid_spacing_voxels: {type: integer, minimum: 1}
      candidate_radius_voxels: {type: number, exclusiveMinimum: 0}
      neighbors_per_anchor: {type: integer, minimum: 0}
      interpolation_order: {$ref: "#/$defs/registration_interpolation_order"}
      field_smoothing_sigma: {type: ["number", "null"], minimum: 0}
      clamp_sampling_coordinates: {type: boolean}

  registration_params:
    description: "Python-only explicit RegistrationRecipe (registration contract, Python-only key); mutually exclusive with an enabled global_registration or local_registration"
    type: object
    required: [steps]
    additionalProperties: false
    properties:
      steps:
        type: array
        minItems: 1
        items:
          oneOf:
            - $ref: "#/$defs/registration_step_translation"
            - $ref: "#/$defs/registration_step_rigid"
            - $ref: "#/$defs/registration_step_affine"
            - $ref: "#/$defs/registration_step_bspline"
            - $ref: "#/$defs/registration_step_demons"
            - $ref: "#/$defs/registration_step_tps"
            - $ref: "#/$defs/registration_step_cpd"
      signal: {$ref: "#/$defs/registration_signal"}
      warp: {$ref: "#/$defs/registration_warp"}
      qc: {$ref: "#/$defs/registration_qc"}
      reference_round: {type: ["string", "null"]}

  python_rule_parameters:
    description: >-
      The explicit preprocessing and registration keys replace their legacy keys. device
      (Python only) is the execution device of the methods; §2.7 accepts only cpu.
    properties:
      device:
        enum: ["cpu"]
    allOf:
      - if: {required: [preprocessing]}
        then:
          not:
            anyOf:
              - required: [enhance_contrast]
              - required: [hist_equalize]
              - required: [morph_recon]
              - required: [tophat]
              - required: [snr_threshold]
      - if: {required: [registration]}
        then:
          not:
            anyOf:
              - required: [global_registration]
                properties: {global_registration: {required: [run], properties: {run: {const: true}}}}
              - required: [local_registration]
                properties: {local_registration: {required: [run], properties: {run: {const: true}}}}

  registration_recovery_params:
    description: "Python-only opt-in recovery; validation/dependency/application errors never recover"
    type: object
    required: [allowed_errors, alternatives]
    additionalProperties: false
    properties:
      allowed_errors:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum: [RegistrationEstimationError, InsufficientLandmarksError, RegistrationRejectedError]
      alternatives:
        type: array
        minItems: 1
        items:
          type: object
          description: "Ordered estimator configs; Python adapter validates method-specific fields"

  global_registration_params:
    type: object
    properties:
      run:
        type: boolean
      ref_round:
        type: string
      ref_img:
        type: string
        enum: ["merged-image", "single-channel"]
      mov_img:
        type: string
        enum: ["merged-image", "single-channel"]
      ref_channel:
        type: integer
        minimum: 0
        description: "Python zero-based reference/moving channel"
      recovery:
        $ref: "#/$defs/registration_recovery_params"
    additionalProperties: true

  create_subtiles_params:
    type: object
    properties:
      run:
        type: boolean
      sqrt_pieces:
        type: integer
        minimum: 1
    additionalProperties: true

  local_registration_params:
    type: object
    properties:
      run:
        type: boolean
      ref_round:
        type: string
      method:
        type: string
        description: "The registered local methods and the legacy demons variant names (a default-tier test keeps them equal to REGISTRATION_METHODS)"
        enum: ["bspline", "cpd", "demons", "tps", "diffeomorphic", "symmetric", "fast_symmetric"]
        default: "demons"
      ref_img:
        type: string
        enum: ["merged-image", "single-channel"]
        description: "Python only: the local registration signal (merged-image, the default, is the channel maximum)"
      mov_img:
        type: string
        enum: ["merged-image", "single-channel"]
        description: "Python only: must equal ref_img"
      ref_channel:
        type: integer
        minimum: 0
        description: "Python zero-based reference/moving channel"
      recovery:
        $ref: "#/$defs/registration_recovery_params"
    additionalProperties: true

  spot_finding_params:
    description: >-
      Shared keys run, ref_round, intensity_threshold and intensity_estimation. Python-only:
      method (a SPOT_FINDING_METHODS name with pipeline=True, default local_maxima) and the
      fields of its config; intensity_estimation, intensity_threshold and min_distance are
      aliases for local_maxima only (each raises together with its field); channel_overrides
      maps a channel label to fields that replace the block's for that channel. The Python
      adapter validates the fields of the selected method.
    type: object
    properties:
      run:
        type: boolean
      ref_round:
        type: string
      intensity_threshold:
        type: number
        minimum: 0
      intensity_estimation:
        type: string
        enum: ["global", "noise", "adaptive", "adaptive_round"]
      method:
        description: "Python only; kept equal to the pipeline SPOT_FINDING_METHODS names by a test"
