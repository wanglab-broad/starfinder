# JSON Schema for STARfinder configuration files
# Validates config at pipeline startup to catch errors early

$schema: "https://json-schema.org/draft/2020-12/schema"
description: "STARfinder pipeline configuration schema"

type: object
required:
  - config_path
  - starfinder_path
  - root_input_path
  - root_output_path
  - dataset_id
  - sample_id
  - output_id
  - n_rounds
  - ref_round
  - rotate_angle
  - rules

properties:
  # ==================== Path Configuration ====================
  config_path:
    type: string
    description: "Absolute path to this config file"

  envs_path:
    type: string
    description: "Path to conda environments directory"

  starfinder_path:
    type: string
    description: "Path to STARfinder repository root"

  fiji_path:
    type: string
    description: "Path to Fiji/ImageJ executable"

  root_input_path:
    type: string
    description: "Root directory for input data"

  root_output_path:
    type: string
    description: "Root directory for output data"

  # ==================== Dataset Metadata ====================
  dataset_id:
    type: string
    description: "Dataset identifier"

  sample_id:
    type: string
    description: "Sample identifier within dataset"

  output_id:
    type: string
    description: "Output folder identifier"

  # The FOVs: MATLAB backend only (required there). The Python backend reads <input>/fovs.csv
  # (sample,fov_id and an optional position_id) and selected_fovs, and refuses these eight keys.
  fov_id_pattern:
    type: string
    description: "MATLAB backend only: pattern for FOV naming (e.g., 'tile_{i}' or 'Position{i:03}')"

  n_fovs:
    type: integer
    minimum: 1
    description: "MATLAB backend only: total number of FOVs in the dataset"

  selected_fovs:
    type: [array, "null"]
    items:
      type: string
      minLength: 1
    minItems: 1
    uniqueItems: true
    description: >-
      Python only: the FOV IDs of fovs.csv to run (absent or null: every FOV); restricts every
      rule, per-sample rules included

  n_rounds:
    type: integer
    minimum: 1
    description: "Number of sequencing rounds"

  ref_round:
    type: string
    description: "Reference round for registration (e.g., 'round1')"

  ref_channel:
    type: string
    description: "Reference channel for registration"

  dapi_round:
    type: string
    description: >-
      MATLAB backend only: the round whose *ch04.tif is the nuclear stain (nuclei_registration.m,
      rotate_nuclei). The Python backend declares the stain files with reference_stains.

  reference_stains:
    type: [array, "null"]
    minItems: 1
    items:
      $ref: "#/$defs/channel_info"
    description: >-
      Python only (Dataset.reference_stains): the reference round's stain files that are not sequencing
      colours, as {channel, name} entries (channel the file pattern and label, name the content); absent or
      null is none. rotate_nuclei and nuclei_registration read the one entry, or with several the one whose
      name contains ref_channel. Replaces MATLAB's dapi_round and its hard-coded *ch04.tif.

  rotate_angle:
    type: number
    description: "Rotation angle for image alignment (degrees)"

  # ==================== Image Dimensions ====================
  # Required for the MATLAB backend; for the Python backend only by their consumers: the subtile windows
  # (create_subtiles) and the legacy tile configuration writer (stitching method bigstitcher without an
  # assembly block). See the allOf clauses below.
  img_col:
    type: integer
    minimum: 1
    description: "Image width in pixels"

  img_row:
    type: integer
    minimum: 1
    description: "Image height in pixels"

  img_z:
    type: integer
    minimum: 1
    description: "Number of z-slices (for 3D data)"

  voxel_size_xy:
    type: number
    exclusiveMinimum: 0
    description: "XY pixel size in microns"

  voxel_size_z:
    type: number
    exclusiveMinimum: 0
    description: "Z step size in microns"

  reference_image:
    type: [string, "null"]
    pattern: "\\{fov_id\\}"
    description: >-
      File pattern of a FOV's reference image with {fov_id}, absolute or relative to the output root
      (Python only); absent or null is fovs/{fov_id}/reference.tif. The Python processing rules write it there,
      and every reader reads it there. Excludes reference_image_import.

  reference_image_import:
    type: [string, "null"]
    pattern: "\\{fov_id\\}"
    description: >-
      File pattern with {fov_id} of an imported reference image, one another tool or rule produced,
      absolute or relative to the output root (Python only). The processing rules then write no reference
      image, and every reader reads this file; nothing writes to it. Excludes reference_image.

  image_dir_template:
    type: [string, "null"]
    enum: ["{round}/{fov}", "{fov}/{round}", null]
    description: >-
      Layout of the acquisition images under the input root (Python only; Dataset.image_dir_template):
      "{round}/{fov}" (absent or null), a folder per round holding a folder per FOV, or "{fov}/{round}", a
      folder per FOV holding a folder per round. The MATLAB rules read the round-first layout only.

  codebook:
    type: [string, "null"]
    minLength: 1
    description: >-
      The codebook the sequencing rules read and whose genes, in its order, are the count matrix's columns
      (Python only; readout_mode multiplexed), absolute or relative to the input root; absent or null is
      <input root>/genes.csv, the file the MATLAB rules read.

  direct_panel:
    type: [string, "null"]
    minLength: 1
    description: >-
      The direct panel (round,channel,gene_id) of readout_mode direct (Python only), absolute or relative to
      the input root; absent or null is <input root>/genes.csv.

  maximum_projection:
    type: boolean
    default: false
    description: "Whether to use maximum intensity projection for 2D analysis"

  # ==================== Channel Configuration ====================
  seq_channel_order:
    description: >-
      Custom sequencing channel order (empty for default): a list of file patterns, or a
      list of wavelength/channel/name entries (MATLAB's channel_order_dict). Python records
      the name and wavelength (Dataset.channel_info).
    anyOf:
      - type: array
        items:
          type: string
      - type: array
        items:
          $ref: "#/$defs/channel_info"

  additional_round:
    type: array
    items:
      type: object
      properties:
        round_name:
          type: string
        channel_order:
          type: array
          minItems: 1
          items:
            $ref: "#/$defs/channel_info"
          description: >-
            The round's channels in C order: channel is the file pattern, name the content
            (nuclei_registration matches ref_channel in it and writes images/<round>/<name>).
    description: "Additional imaging rounds beyond sequencing"

  # ==================== Readout Mode ====================
  readout_mode:
    type: string
    enum: ["multiplexed", "direct"]
    default: "multiplexed"
    description: >-
      Python only (Dataset.readout_mode). multiplexed decodes color sequences with the
      codebook; direct assigns each candidate the gene of its own round and channel from
      the panel CSV (round,channel,gene_id; direct_panel), which is then the rule's codebook input, and
      needs spot_finding.rounds. direct requires backend python.

  # ==================== Segmentation and assignment (Python only) ====================
  segmentation:
    $ref: "#/$defs/segmentation_block"

  assignment:
    $ref: "#/$defs/assignment_block"

  # ==================== Stitching, assembly and export (Python only) ====================
  stitching:
    $ref: "#/$defs/stitching_block"

  assembly:
    $ref: "#/$defs/assembly_block"

  export:
    $ref: "#/$defs/export_block"

  # ==================== Processing report (Python only) ====================
  report:
    $ref: "#/$defs/report_block"

  # ==================== Backend Selection ====================
  backend:
    type: string
    enum: ["python", "matlab"]
    default: "matlab"
    description: "Processing backend for registration and spot finding"

  matlab_launcher:
    type: string
    enum: ["path", "broad"]
    default: "path"
    description: "MATLAB invocation: 'path' uses STARFINDER_MATLAB_EXECUTABLE or matlab on PATH; 'broad' loads 'use Matlab' first"

  matlab_single_thread:
    type: boolean
    default: false
    description: "Start MATLAB with -singleCompThread"

  # ==================== Workflow Mode ====================
  workflow_mode:
    type: string
    enum: ["free", "direct", "subtile", "deep"]
    default: "free"
    description: |
      Workflow mode:
      - 'free': Mix and match rules using individual run flags
      - 'direct': Single FOV processing via rsf_single_fov
      - 'subtile': Subtile-based workflow (gr → lrsf → stitch)
      - 'deep': Deep-tissue optimized workflow

  # ==================== Subsetting Options (MATLAB backend only) ====================
  # No default here: Snakemake's validate inserts schema defaults, and the Python backend refuses these keys.
  subset_list:
    type: array
    items:
      type: integer
      minimum: 1
    description: "Explicit list of FOV indices to process"

  subset_range:
    type: boolean
    description: "Enable range-based subsetting (absent: false, applied by common.smk's MATLAB branch)"

  subset_start:
    type: integer
    minimum: 1
    description: "Start FOV index for range subsetting"

  subset_end:
    type: integer
    minimum: 1
    description: "End FOV index for range subsetting"

  subset_random:
    type: boolean
    description: "Enable random subsetting (absent: false, applied by common.smk's MATLAB branch)"

  n_random_tests:
    type: integer
    minimum: 1
    description: "Number of random FOVs to select"

  # ==================== Rules Configuration ====================
  rules:
    type: object
    description: "Per-rule configuration"
    additionalProperties: false
    properties:
      rsf_single_fov:
        $ref: "#/$defs/rsf_single_fov_config"

      rsf_single_fov_seq:
        $ref: "#/$defs/rule_with_resources"

      gr_single_fov_subtile:
        $ref: "#/$defs/gr_single_fov_subtile_config"

      lrsf_single_fov_subtile:
        $ref: "#/$defs/lrsf_single_fov_subtile_config"

      deep_create_subtile:
        $ref: "#/$defs/deep_create_subtile_config"

      deep_rsf_subtile:
        $ref: "#/$defs/deep_rsf_subtile_config"

      stitch_subtile:
        $ref: "#/$defs/rule_with_resources"

      nuclei_registration:
        $ref: "#/$defs/nuclei_registration_config"

      rotate_nuclei:
        $ref: "#/$defs/rule_with_resources"

      create_nuclei_amplicon_overlay:
        $ref: "#/$defs/create_nuclei_amplicon_overlay_config"

      enhance_dapi_with_flamingo:
        $ref: "#/$defs/rule_with_resources"

      stardist_segmentation:
        $ref: "#/$defs/stardist_segmentation_config"

      stitching_preparation:
        $ref: "#/$defs/rule_with_resources"

      create_BigStitcher_macro:
        $ref: "#/$defs/rule_with_resources"

      run_BigStitcher_macro:
        $ref: "#/$defs/rule_with_resources"

      create_tile_config:
        $ref: "#/$defs/rule_with_resources"

      reads_assignment:
        $ref: "#/$defs/reads_assignment_config"

      create_sample_h5ad:
        $ref: "#/$defs/rule_with_resources"

      create_sample_reads_assignment:
        $ref: "#/$defs/rule_with_resources"

# ==================== Conditional Validation ====================
dependentRequired:
  subset_range:
    - subset_start
    - subset_end
  subset_random:
    - n_random_tests
  # The assembly block reads the stitching block's placement; the export block configures
  # the export_sample rule, which runs with an assembly block only.
  assembly:
    - stitching
  export:
    - assembly

allOf:
  # The MATLAB backend (the default) names its FOVs by fov_id_pattern and n_fovs and selects them with
  # the subset keys; the Python backend reads fovs.csv and selected_fovs and refuses those keys.
  - if:
      required: [backend]
      properties:
        backend:
          const: python
    then:
      not:
        anyOf:
          - required: [fov_id_pattern]
          - required: [n_fovs]
          - required: [subset_list]
          - required: [subset_range]
          - required: [subset_start]
          - required: [subset_end]
          - required: [subset_random]
          - required: [n_random_tests]
    else:
      required:
        - fov_id_pattern
        - n_fovs
        - img_col
        - img_row

  # The Python backend requires img_row and img_col only where they are read: the subtile windows of an
  # active create_subtiles block (gr_single_fov_subtile or deep_create_subtile) and the legacy tile
  # configuration writer of stitching method bigstitcher (the default) without an assembly block.
  - if:
      required: [backend]
      properties:
        backend:
          const: python
      anyOf:
        - required: [rules]
          properties:
            rules:
              anyOf:
                - required: [gr_single_fov_subtile]
                  properties:
                    gr_single_fov_subtile: {$ref: "#/$defs/active_create_subtiles"}
                - required: [deep_create_subtile]
                  properties:
                    deep_create_subtile: {$ref: "#/$defs/active_create_subtiles"}
        - required: [stitching]
          not: {required: [assembly]}
          properties:
            stitching:
              anyOf:
                - not: {required: [method]}
                - properties: {method: {const: bigstitcher}}
    then:
      required:
        - img_col
        - img_row

  # The Python backend accepts one dialect: the MATLAB keys of the processing rules (the preprocessing
  # keys, the registration blocks and local_maxima's spot-finding aliases) and dapi_round raise, whatever
  # a block's run flag, also inside spot_finding.channel_overrides and in the registration key's recovery
  # alternatives (the native step definitions refuse them already); their definitions below stay for
  # the MATLAB backend, which reads them from its JSON copy.
  - if:
      required: [backend]
      properties:
        backend:
          const: python
    then:
      not:
        required: [dapi_round]
      properties:
        rules:
          additionalProperties:
            properties:
              parameters:
                not:
                  anyOf:
                    - required: [enhance_contrast]
                    - required: [hist_equalize]
                    - required: [morph_recon]
                    - required: [tophat]
                    - required: [snr_threshold]
                    - required: [global_registration]
                    - required: [local_registration]
                    - required: [spot_finding]
                      properties:
                        spot_finding:
                          anyOf:
                            - required: [intensity_estimation]
                            - required: [intensity_threshold]
                            - required: [min_distance]
                              anyOf:
                                - not: {required: [method]}
                                - properties: {method: {const: local_maxima}}
                    # An entry of channel_overrides with a MATLAB key (min_distance for local_maxima only).
                    - required: [spot_finding]
                      properties:
                        spot_finding:
                          required: [channel_overrides]
                          properties:
                            channel_overrides:
                              not:
                                additionalProperties:
                                  not:
                                    anyOf:
                                      - required: [intensity_estimation]
                                      - required: [intensity_threshold]
                    - required: [spot_finding]
                      properties:
                        spot_finding:
                          required: [channel_overrides]
                          anyOf:
                            - not: {required: [method]}
                            - properties: {method: {const: local_maxima}}
                          properties:
                            channel_overrides:
                              not:
                                additionalProperties:
                                  not: {required: [min_distance]}
                    # A recovery alternative of a registration step with a MATLAB name.
                    - required: [registration]
                      properties:
                        registration:
                          required: [steps]
                          properties:
                            steps:
                              not:
                                items:
                                  not:
                                    required: [recovery]
                                    properties:
                                      recovery:
                                        required: [alternatives]
                                        properties:
                                          alternatives:
                                            not:
                                              items:
                                                not: {$ref: "#/$defs/matlab_registration_names"}

  # If subset_range is true, require subset_start and subset_end (MATLAB backend)
  - if:
      not:
        required: [backend]
        properties:
          backend:
            const: python
      properties:
        subset_range:
          const: true
    then:
      required:
        - subset_start
        - subset_end

  # If subset_random is true, require n_random_tests (MATLAB backend)
  - if:
      not:
        required: [backend]
        properties:
          backend:
            const: python
      properties:
        subset_random:
          const: true
    then:
      required:
        - n_random_tests

  # The explicit preprocessing and registration recipes, the reference image view, the reference
  # stains, the spot-finding method, channel overrides and rounds, the execution device, readout_mode direct, scoring,
  # deduplication, reads_extraction.background, load_codebook.encoding.pair_to_color, the
  # segmentation, assignment, stitching, assembly, export and report blocks, the
  # stardist_segmentation target and the rules' checkpoints are Python-only (backend
  # defaults to matlab)
  - if:
      not:
        required: [backend]
        properties:
          backend:
            const: python
    then:
      not:
        anyOf:
          - required: [selected_fovs]
          - required: [reference_stains]
          - required: [segmentation]
          - required: [assignment]
          - required: [stitching]
          - required: [assembly]
          - required: [export]
          - required: [report]
      properties:
        readout_mode:
          const: multiplexed
        rules:
          additionalProperties:
            properties:
              parameters:
                not:
                  anyOf:
                    - required: [preprocessing]
                    - required: [registration]
                    - required: [reference_image_view]
                    - required: [device]
                    - required: [target]
                    - required: [scoring]
                    - required: [deduplication]
                    - required: [checkpoints]
                    - required: [reads_extraction]
                      properties:
                        reads_extraction:
                          required: [background]
                    - required: [load_codebook]
                      properties:
                        load_codebook:
                          required: [encoding]
                          properties:
                            encoding:
                              required: [pair_to_color]
                    - required: [spot_finding]
                      properties:
                        spot_finding:
                          anyOf:
                            - required: [method]
                            - required: [channel_overrides]
                            - required: [rounds]

# ==================== Reusable Definitions ====================
$defs:
  channel_info:
    type: object
    required: [channel]
    additionalProperties: false
    properties:
      wavelength:
        type: number
        exclusiveMinimum: 0
        description: "Wavelength in nm; absent when unknown (recorded as unavailable)"
      channel:
        type: string
        minLength: 1
        description: "File pattern (*<channel>.tif), the channel label"
      name:
        type: string
        minLength: 1
        description: "Content of the channel, for example DAPI or seq"

  # Base resources schema
  resources:
    type: object
    properties:
      mem_mb:
        type: integer
        minimum: 1000
        default: 8000
        description: "Memory in MB"
      runtime:
        type: integer
        minimum: 1
        default: 30
        description: "Runtime in minutes"
    additionalProperties: false

  # Base rule with just run flag and resources
  rule_with_resources:
    type: object
    required:
      - run
    properties:
      run:
        type: boolean
        description: "Whether to run this rule"
      resources:
        $ref: "#/$defs/resources"
    additionalProperties: true

  # ==================== Parameter Definitions ====================
  enhance_contrast_params:
    type: object
    properties:
      run:
        type: boolean
    additionalProperties: true

  hist_equalize_params:
    type: object
    properties:
      run:
        type: boolean
      reference_channel:
        type: integer
    additionalProperties: true

  morph_recon_params:
    type: object
    properties:
      run:
        type: boolean
      radius:
        type: integer
        minimum: 1
    additionalProperties: true

  tophat_params:
    description: >-
      White top-hat per XY slice (TophatConfig(radius_yx=radius)). No MATLAB script reads it; the Python
      backend refuses it (preprocessing white_tophat), and the adapters of the shared rules translate it
      for MATLAB-backend configurations.
    type: object
    properties:
      run:
        type: boolean
      radius:
        type: integer
        minimum: 1
    additionalProperties: false

  # ==================== Explicit preprocessing recipe (Python only) ====================
  # One definition per step registered in starfinder.preprocessing.PREPROCESSING_METHODS. Keys other
  # than method and save_as are the fields of the step's config dataclass; a
  # default-tier test keeps these definitions equal to PREPROCESSING_METHODS.
  snapshot_name:
    type: string
    pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
    not:
      const: detection

  preprocessing_fit:
    type: string
    enum: ["fov", "supplied"]

  preprocessing_rounding:
    type: string
    enum: ["truncate", "nearest_even"]

  preprocessing_step_min_max_normalization:
    type: object
    required: [method, output_dtype, output_range]
    additionalProperties: false
    properties:
      method: {const: min_max_normalization}
      save_as: {$ref: "#/$defs/snapshot_name"}
      output_dtype: {type: string}
      output_range:
        type: array
        items: {type: number}
        minItems: 2
        maxItems: 2
      scope: {type: string, enum: ["per_channel", "global"]}
      snr_threshold: {type: ["number", "null"], minimum: 0}
      rounding: {$ref: "#/$defs/preprocessing_rounding"}

  preprocessing_step_histogram_matching:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: histogram_matching}
      save_as: {$ref: "#/$defs/snapshot_name"}
      output_dtype: {type: ["string", "null"]}
      rounding: {$ref: "#/$defs/preprocessing_rounding"}
      reference_channel: {type: integer, minimum: 0}
      fit: {$ref: "#/$defs/preprocessing_fit"}

  preprocessing_step_reconstruction:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: reconstruction}
      save_as: {$ref: "#/$defs/snapshot_name"}
      radius_yx: {type: integer, minimum: 1}

  preprocessing_step_white_tophat:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: white_tophat}
      save_as: {$ref: "#/$defs/snapshot_name"}
      radius_yx: {type: integer, minimum: 1}

  preprocessing_step_scalar_background:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: scalar_background}
      save_as: {$ref: "#/$defs/snapshot_name"}
      percentile: {type: number, minimum: 0, exclusiveMaximum: 100}
      fit: {$ref: "#/$defs/preprocessing_fit"}

  preprocessing_step_background_3d:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: background_3d}
      save_as: {$ref: "#/$defs/snapshot_name"}
      radius_um_zyx:
        type: array
        items: {type: number, minimum: 0}
        minItems: 3
        maxItems: 3
      radius_voxels_zyx:
        type: array
        items: {type: integer, minimum: 0}
        minItems: 3
        maxItems: 3

  preprocessing_step_percentile_normalization:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: percentile_normalization}
      save_as: {$ref: "#/$defs/snapshot_name"}
      p_low: {type: number, minimum: 0, maximum: 100}
      p_high: {type: number, minimum: 0, maximum: 100}
      fit: {$ref: "#/$defs/preprocessing_fit"}

  preprocessing_params:
    description: >-
      Python-only explicit recipe (preprocessing contract, Explicit step list): steps before registration and
      post_registration, the steps run after it (reconstruction only); it replaces enhance_contrast,
      hist_equalize, morph_recon, tophat and snr_threshold
    type: object
    required: [steps]
    additionalProperties: false
    properties:
      post_registration:
        type: array
        items:
          allOf:
            - $ref: "#/$defs/preprocessing_step_reconstruction"
            - not: {required: [save_as]}
      steps:
        type: array
        items:
          oneOf:
            - $ref: "#/$defs/preprocessing_step_min_max_normalization"
            - $ref: "#/$defs/preprocessing_step_histogram_matching"
            - $ref: "#/$defs/preprocessing_step_reconstruction"
            - $ref: "#/$defs/preprocessing_step_white_tophat"
            - $ref: "#/$defs/preprocessing_step_scalar_background"
            - $ref: "#/$defs/preprocessing_step_background_3d"
            - $ref: "#/$defs/preprocessing_step_percentile_normalization"
      extraction_source:
        oneOf: [{$ref: "#/$defs/snapshot_name"}, {type: "null"}]
      registration_source:
        oneOf: [{$ref: "#/$defs/snapshot_name"}, {type: "null"}]
      supplied_statistics: {type: ["string", "null"]}

  # ==================== Explicit registration recipe (Python only) ====================
  # One definition per method registered in starfinder.registration.REGISTRATION_METHODS. Keys
  # other than method, recovery and signal are the fields of the method's config dataclass; a
  # default-tier test keeps these definitions, and the signal, warp and qc definitions, equal to
  # REGISTRATION_METHODS and the config dataclasses.
  registration_channel:
    oneOf:
      - {type: integer, minimum: 0}
      - {type: string, minLength: 1}
      - {type: "null"}

  registration_signal:
    type: object
    additionalProperties: false
    properties:
      mode: {type: string, enum: ["max", "sum", "channel"]}
      reference_channel: {$ref: "#/$defs/registration_channel"}
      moving_channel: {$ref: "#/$defs/registration_channel"}

  registration_warp:
    type: object
    additionalProperties: false
    properties:
      backend: {type: string, enum: ["translation", "scipy", "simpleitk"]}
      boundary_mode: {type: string, enum: ["constant", "nearest"]}
      fill_value: {type: number}
      output_dtype: {type: string, enum: ["input", "float32", "float64"]}
      integer_rounding: {type: string, enum: ["nearest_even"]}
      clip_to_dtype: {const: true}
      fft_workers: {type: integer, minimum: 1}

  registration_qc:
    type: object
    additionalProperties: false
    properties:
      min_coverage: {type: ["number", "null"], minimum: 0, maximum: 1}
      min_ncc_gain: {type: ["number", "null"]}
      max_fold_fraction: {type: ["number", "null"], minimum: 0, maximum: 1}
      max_translation_voxels: {type: ["number", "null"], minimum: 0}
      projections: {type: boolean}

  registration_step_recovery:
    description: "Opt-in recovery; alternatives name methods of the step's kind and configure estimators only"
    type: object
    required: [allowed_errors, alternatives]
    additionalProperties: false
    properties:
      allowed_errors:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum: [RegistrationEstimationError, InsufficientLandmarksError, RegistrationRejectedError]
      alternatives:
        type: array
        minItems: 1
        items:
          type: object
          required: [method]
          not:
            anyOf:
              - required: [recovery]
              - required: [signal]

  registration_elastix_levels:
    type: ["integer", "null"]
    minimum: 1

  registration_interpolation_order:
    type: integer
    minimum: 0
    maximum: 5

  registration_step_translation:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: translation}
      recovery: {$ref: "#/$defs/registration_step_recovery"}
      signal: {$ref: "#/$defs/registration_signal"}
      backend: {type: string, enum: ["scipy_fft", "skimage"]}
      fft_workers: {type: integer, minimum: 1}

  registration_step_rigid:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: rigid}
      recovery: {$ref: "#/$defs/registration_step_recovery"}
      signal: {$ref: "#/$defs/registration_signal"}
      metric: {type: string, enum: ["mattes", "ncc"]}
      histogram_bins: {type: integer, minimum: 2}
      iterations: {type: integer, minimum: 1}
      samples: {type: integer, minimum: 1}
      levels: {$ref: "#/$defs/registration_elastix_levels"}
      random_seed: {type: integer, minimum: 0}

  registration_step_affine:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: affine}
      recovery: {$ref: "#/$defs/registration_step_recovery"}
      signal: {$ref: "#/$defs/registration_signal"}
      metric: {type: string, enum: ["ncc", "mattes"]}
      iterations: {type: integer, minimum: 1}
      samples: {type: integer, minimum: 1}
      levels: {$ref: "#/$defs/registration_elastix_levels"}
      random_seed: {type: integer, minimum: 0}

  registration_step_bspline:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: bspline}
      recovery: {$ref: "#/$defs/registration_step_recovery"}
      signal: {$ref: "#/$defs/registration_signal"}
      metric: {type: string, enum: ["ncc", "mattes"]}
      grid_spacing_physical: {type: ["number", "null"], exclusiveMinimum: 0}
      iterations: {type: integer, minimum: 1}
      samples: {type: integer, minimum: 1}
      levels: {$ref: "#/$defs/registration_elastix_levels"}
      random_seed: {type: integer, minimum: 0}

  registration_step_demons:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: demons}
      recovery: {$ref: "#/$defs/registration_step_recovery"}
      signal: {$ref: "#/$defs/registration_signal"}
      variant: {type: string, enum: ["demons", "diffeomorphic", "symmetric", "fast_symmetric"]}
      iterations:
        type: array
        minItems: 1
        items: {type: integer, minimum: 1}
      smoothing_sigma: {type: number, minimum: 0}
      pyramid_mode: {type: string, enum: ["antialias", "sitk"]}

  registration_step_tps:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: tps}
      recovery: {$ref: "#/$defs/registration_step_recovery"}
      signal: {$ref: "#/$defs/registration_signal"}
      detection_noise_sigma: {type: number, minimum: 0}
      match_distance_voxels: {type: number, exclusiveMinimum: 0}
      min_matches: {type: integer, minimum: 4}
      max_control_points: {type: integer, minimum: 4}
      smoothing: {type: number, minimum: 0}
      grid_spacing_voxels: {type: integer, minimum: 1}
      interpolation_order: {$ref: "#/$defs/registration_interpolation_order"}
      field_smoothing_sigma: {type: ["number", "null"], minimum: 0}
      clamp_sampling_coordinates: {type: boolean}

  registration_step_cpd:
    type: object
    required: [method]
    additionalProperties: false
    properties:
      method: {const: cpd}
      recovery: {$ref: "#/$defs/registration_step_recovery"}
      signal: {$ref: "#/$defs/registration_signal"}
      detection_noise_sigma: {type: number, minimum: 0}
      max_control_points: {type: integer, minimum: 4}
      kernel_width_voxels: {type: ["number", "null"], exclusiveMinimum: 0}
      regularization_weight: {type: number, exclusiveMinimum: 0}
      outlier_fraction: {type: number, minimum: 0, exclusiveMaximum: 1}
      affine_first: {type: boolean}
      grid_spacing_voxels: {type: integer, minimum: 1}
      candidate_radius_voxels: {type: number, exclusiveMinimum: 0}
      neighbors_per_anchor: {type: integer, minimum: 0}
      interpolation_order: {$ref: "#/$defs/registration_interpolation_order"}
      field_smoothing_sigma: {type: ["number", "null"], minimum: 0}
      clamp_sampling_coordinates: {type: boolean}

  registration_params:
    description: "Python-only explicit RegistrationRecipe (registration contract, Python-only key); mutually exclusive with an enabled global_registration or local_registration"
    type: object
    required: [steps]
    additionalProperties: false
    properties:
      steps:
        type: array
        minItems: 1
        items:
          oneOf:
            - $ref: "#/$defs/registration_step_translation"
            - $ref: "#/$defs/registration_step_rigid"
            - $ref: "#/$defs/registration_step_affine"
            - $ref: "#/$defs/registration_step_bspline"
            - $ref: "#/$defs/registration_step_demons"
            - $ref: "#/$defs/registration_step_tps"
            - $ref: "#/$defs/registration_step_cpd"
      signal: {$ref: "#/$defs/registration_signal"}
      warp: {$ref: "#/$defs/registration_warp"}
      qc: {$ref: "#/$defs/registration_qc"}
      reference_round: {type: ["string", "null"]}

  python_rule_parameters:
    description: >-
      The explicit preprocessing and registration keys replace their legacy keys. device
      (Python only) is the execution device of the methods; §2.7 accepts only cpu.
      reference_image_view (Python only) selects the reference image the rule writes.
    properties:
      device:
        enum: ["cpu"]
      reference_image_view:
        description: >-
          Python only: the reference image of the rule (FOV.save_reference_image), mode max (the default,
          the channel maximum) or mode channel with channel, a zero-based index or a channel label of the
          reference round. The resident subtile rules write none and refuse the key.
        type: object
        additionalProperties: false
        properties:
          mode: {enum: ["max", "channel"]}
          channel: {type: ["integer", "string"], minimum: 0}
        if:
          required: [mode]
          properties: {mode: {const: channel}}
        then:
          required: [channel]
        else:
          not: {required: [channel]}
      checkpoints:
        description: >-
          Python only (backend python). The checkpoint stages the rule writes besides
          fovs/<fov>/run.json, as {stages: [...]} in fovs/<fov>/checkpoints/; absent or null is {stages: []}, run.json
          alone. A rerun replaces the FOV's earlier record (overwrite); the declared outputs do not
          change.
        type: [object, "null"]
        properties:
          stages:
            type: array
            items:
              enum: ["registered", "candidates", "pre_qc"]
            uniqueItems: true
        additionalProperties: false
    allOf:
      - if: {required: [preprocessing]}
        then:
          not:
            anyOf:
              - required: [enhance_contrast]
              - required: [hist_equalize]
              - required: [morph_recon]
              - required: [tophat]
              - required: [snr_threshold]
      - if: {required: [registration]}
        then:
          not:
            anyOf:
              - required: [global_registration]
                properties: {global_registration: {required: [run], properties: {run: {const: true}}}}
              - required: [local_registration]
                properties: {local_registration: {required: [run], properties: {run: {const: true}}}}

  registration_recovery_params:
    description: "Python-only opt-in recovery; validation/dependency/application errors never recover"
    type: object
    required: [allowed_errors, alternatives]
    additionalProperties: false
    properties:
      allowed_errors:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum: [RegistrationEstimationError, InsufficientLandmarksError, RegistrationRejectedError]
      alternatives:
        type: array
        minItems: 1
        items:
          type: object
          description: "Ordered estimator configs; Python adapter validates method-specific fields"

  global_registration_params:
    type: object
    properties:
      run:
        type: boolean
      ref_round:
        type: string
      ref_img:
        type: string
        enum: ["merged-image", "single-channel"]
      mov_img:
        type: string
        enum: ["merged-image", "single-channel"]
      ref_channel:
        type: integer
        minimum: 0
        description: "Python zero-based reference/moving channel"
      recovery:
        $ref: "#/$defs/registration_recovery_params"
    additionalProperties: true

  # A registration entry with a MATLAB name: a parameter or block key of the legacy blocks, or a demons
  # variant as the method (the Python backend refuses it; the native names are those of the step's config).
  matlab_registration_names:
    anyOf:
      - required: [detection_threshold]
      - required: [match_distance]
      - required: [tps_smoothing]
      - required: [grid_spacing]
      - required: [beta]
      - required: [lmbda]
      - required: [cpd_w]
      - required: [candidate_radius]
      - required: [k_neighbors]
      - required: [ref_img]
      - required: [mov_img]
      - required: [ref_channel]
      - required: [boundary_mode]
      - required: [method]
        properties:
          method: {enum: ["diffeomorphic", "symmetric", "fast_symmetric"]}

  # A rule whose create_subtiles block sets the subtile windows (run true, or a window setting given).
  active_create_subtiles:
    required: [parameters]
    properties:
      parameters:
        required: [create_subtiles]
        properties:
          create_subtiles:
            anyOf:
              - required: [run]
                properties: {run: {const: true}}
              - required: [sqrt_pieces]
              - required: [overlap_ratio]

  create_subtiles_params:
    type: object
    properties:
      run:
        type: boolean
      sqrt_pieces:
        type: integer
        minimum: 1
    additionalProperties: true

  local_registration_params:
    type: object
    properties:
      run:
        type: boolean
      ref_round:
        type: string
      method:
        type: string
        description: "The registered local methods and the legacy demons variant names (a default-tier test keeps them equal to REGISTRATION_METHODS)"
        enum: ["bspline", "cpd", "demons", "tps", "diffeomorphic", "symmetric", "fast_symmetric"]
        default: "demons"
      ref_img:
        type: string
        enum: ["merged-image", "single-channel"]
        description: "Python only: the local registration signal (merged-image, the default, is the channel maximum)"
      mov_img:
        type: string
        enum: ["merged-image", "single-channel"]
        description: "Python only: must equal ref_img"
      ref_channel:
        type: integer
        minimum: 0
        description: "Python zero-based reference/moving channel"
      recovery:
        $ref: "#/$defs/registration_recovery_params"
    additionalProperties: true

  spot_finding_params:
    description: >-
      Shared keys run and ref_round; MATLAB keys intensity_threshold and intensity_estimation.
      Python-only: method (a SPOT_FINDING_METHODS name with pipeline=True, default local_maxima)
      and the fields of its config; for local_maxima the Python backend refuses
      intensity_estimation, intensity_threshold and min_distance, naming threshold_mode,
      threshold_value and min_distance_voxels (the adapters of the shared rules translate them for
      MATLAB-backend configurations); channel_overrides maps a channel label to fields that
      replace the block's for that channel; rounds lists the rounds to detect in. The Python
      adapter validates the fields of the selected method.
    type: object
    properties:
      run:
        type: boolean
      ref_round:
        type: string
      intensity_threshold:
        type: number
        minimum: 0
      intensity_estimation:
        type: string
        enum: ["global", "noise", "adaptive", "adaptive_round"]
      method:
        description: "Python only; kept equal to the pipeline SPOT_FINDING_METHODS names by a test"
        enum: ["local_maxima", "starfish_log", "spotiflow", "piscis"]
      min_distance:
        description: "Python only; local_maxima alias of min_distance_voxels, and the native field of spotiflow and piscis"
        type: integer
        minimum: 1
      threshold_mode:
        description: "Python only; local_maxima"
        enum: ["noise", "adaptive", "adaptive_round", "global"]
      threshold_value:
        description: "Python only; local_maxima"
        type: number
        minimum: 0
      min_distance_voxels:
        description: "Python only; local_maxima"
        type: integer
        minimum: 1
      exclude_border:
        description: "Python only; local_maxima and spotiflow (boolean) and starfish_log (boolean or border width)"
        type: [boolean, integer]
      measure_peak_intensity:
        description: "Python only; local_maxima"
        type: boolean
      merge_radius_zyx:
        description: "Python only; local_maxima opt-in W-218 within-channel merge radii (ZYX voxels), null: off"
        type: [array, "null"]
        items:
          type: number
          exclusiveMinimum: 0
        minItems: 3
        maxItems: 3
      min_sigma:
        description: "Python only; starfish_log (required): sigma in voxels, a number or a ZYX list"
        type: [number, array]
      max_sigma:
        description: "Python only; starfish_log (required): sigma in voxels, a number or a ZYX list"
        type: [number, array]
      num_sigma:
        description: "Python only; starfish_log (required)"
        type: integer
        minimum: 1
      threshold:
        description: >-
          Python only; starfish_log (required): absolute LoG response of the [0, 1]-scaled image;
          piscis: label value in [0, 1] (default 0.5)
        type: number
        minimum: 0
      overlap:
        description: "Python only; starfish_log"
        type: number
        minimum: 0
        maximum: 1
      model:
        description: "Python only; spotiflow and piscis (required): a model of KNOWN_MODELS, fetched with 'starfinder weights fetch'"
        type: string
      prob_thresh:
        description: "Python only; spotiflow: heatmap probability in [0, 1]; null: the value stored with the weights"
        type: [number, "null"]
        minimum: 0
        maximum: 1
      subpix:
        description: "Python only; spotiflow: sub-pixel refinement; null: the model configuration's choice"
        type: [boolean, "null"]
      n_tiles:
        description: "Python only; spotiflow: tiles per model axis (ZYX for 3D models, YX for 2D); null: Spotiflow's choice"
        type: [array, "null"]
        items:
          type: integer
          minimum: 1
        minItems: 2
        maxItems: 3
      input_size:
        description: "Python only; piscis: tile side in pixels, rounded up to a multiple of 8; null: the model's 256"
        type: [integer, "null"]
        minimum: 1
      scale:
        description: "Python only; spotiflow and piscis: must be 1 (resampling is an explicit preprocessing step)"
        const: 1
      channel_overrides:
        description: "Python only; channel label -> config fields of the selected method"
        type: object
        additionalProperties:
          type: object
      rounds:
        description: "Python only; the round labels to detect in (omitted: the reference round only); decoding such a candidate set needs a readout mode (§2.8)"
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
    additionalProperties: true

  load_codebook_params:
    type: object
    properties:
      run:
        type: boolean
      split_index:
        description: >-
          Shared; MATLAB's one-based position, in the encoded color string, of the junction color
          that is removed (aging: [5]). The Python adapter translates it into the two-segment
          layout, equal to the zero-based EncodingConfig.split_index s - 1.
        type: array
        items:
          type: integer
      encoding:
        description: >-
          Python only; method (an ENCODINGS name, default two_base) and the fields of its config
          (two_base: reverse_bases, pair_to_color; one_base: base_to_color, reverse_bases). The method
          list is kept equal to ENCODINGS by a test.
        type: object
        properties:
          method:
            enum: ["two_base", "one_base"]
          reverse_bases:
            type: boolean
          pair_to_color:
            description: >-
              Python only (MATLAB's EncodeBases.m keeps its own table; the schema rejects the key
              unless backend: python); two_base: the 16 ordered base pairs mapped to the colors 1-4,
              the four pairs with one first base to four different colors (checked by the adapter).
              Without it, the default table (AA, CC, GG, TT 1; AC, CA, GT, TG 2; AG, CT, GA, TC 3;
              AT, CG, GC, TA 4).
            type: object
            required: [AA, AC, AG, AT, CA, CC, CG, CT, GA, GC, GG, GT, TA, TC, TG, TT]
            additionalProperties: false
            properties:
              AA: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              AC: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              AG: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              AT: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              CA: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              CC: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              CG: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              CT: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              GA: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              GC: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              GG: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              GT: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              TA: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              TC: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              TG: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              TT: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
          base_to_color:
            description: "one_base: A, C, G and T mapped one-to-one onto the colors 1-4"
            type: object
            required: [A, C, G, T]
            additionalProperties: false
            properties:
              A: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              C: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              G: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
              T: {enum: [1, 2, 3, 4, "1", "2", "3", "4"]}
        additionalProperties: false
    additionalProperties: true

  reads_extraction_params:
    type: object
    properties:
      run:
        type: boolean
      voxel_size:
        type: array
        items:
          type: integer
          minimum: 1
        minItems: 3
        maxItems: 3
      background:
        description: >-
          Python only. The local background and noise measured next to the sums
          (NeighborhoodSumConfig.background, on by default): false turns it off, or a mapping
          of LocalBackgroundConfig fields. Without the key the default ring is used, grown
          along any axis where voxel_size exceeds its inner box.
        oneOf:
          - const: false
          - type: object
            properties:
              inner_radius_zyx:
                type: array
                items: {type: integer, minimum: 0}
                minItems: 3
                maxItems: 3
              outer_radius_zyx:
                type: array
                items: {type: integer, minimum: 0}
                minItems: 3
                maxItems: 3
              min_voxels:
                type: integer
                minimum: 1
            additionalProperties: false
    additionalProperties: true

  reads_filtration_params:
    type: object
    properties:
      run:
        type: boolean
      end_base:
        description: >-
          Shared. A string is one (first, last) pair checked over the whole sequence from
          start_base (one segment). A list gives the allowed ends of the layout's segments: with
          one segment every listed pair, with two segments item k (a pair or a list of pairs) for
          segment k in acquisition order.
        oneOf:
          - type: string
          - type: array
            items:
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
      n_barcode_segments:
        description: "Shared; when given, must equal the number of segments of the codebook layout"
        type: integer
        minimum: 1
      split_index:
        description: "Shared; when given, must equal load_codebook.split_index"
        type: array
        items:
          type: integer
    additionalProperties: true

  scoring_params:
    description: >-
      Python only. The adapter adds the shared read-QC score (ReadScoreConfig) whenever it
      decodes; run false turns it off. It ranks calls and sets no cutoff.
    type: object
    properties:
      run:
        type: boolean
      method:
        enum: ["bgcorr_probability"]
    additionalProperties: false

  deduplication_params:
    description: >-
      Python only. Optional cross-channel deduplication (DeduplicationConfig), off unless run
      is true: reads of one detection round in different channels within distance_voxels
      (inclusive, voxel index space, default 1.0) with identical WTA observed sequences
      without M or N are grouped, and one original read represents each group. Needs
      reads_filtration.run; not available with readout_mode direct. The filter rejects the
      duplicates by default.
    type: object
    properties:
      run:
        type: boolean
      distance_voxels:
        type: number
        minimum: 0
      compatibility:
        enum: ["same_sequence"]
    additionalProperties: false

  decoding_params:
    description: >-
      Python only; method (a DECODING_METHODS name, default wta, or direct with
      readout_mode direct) and the fields of its config. wta and codebook_aware need
      readout_mode multiplexed and direct needs readout_mode direct. Decoding runs with
      reads_filtration.run. The adapter sets diagnostics true and allow_rescue false unless
      given. The method list is kept equal to DECODING_METHODS by a test.
    type: object
    properties:
      method:
        enum: ["wta", "codebook_aware", "direct"]
      negative_policy:
        enum: ["reject", "clip_negative"]
      diagnostics:
        type: boolean
      max_hamming:
        type: integer
        minimum: 0
      max_corrected_round_margin:
        type: [number, "null"]
        minimum: 0
        maximum: 1
      min_score_delta:
        type: number
        minimum: 0
      min_geomean_probability:
        type: number
        minimum: 0
        maximum: 1
      max_correction_penalty:
        type: number
        minimum: 0
      allow_exact:
        type: boolean
      allow_rescue:
        type: boolean
    additionalProperties: false

  # ==================== Rule-Specific Configurations ====================
  rsf_single_fov_config:
    type: object
    required:
      - run
    properties:
      run:
        type: boolean
      resources:
        $ref: "#/$defs/resources"
      parameters:
        type: object
        allOf:
          - $ref: "#/$defs/python_rule_parameters"
        properties:
          preprocessing:
            $ref: "#/$defs/preprocessing_params"
          registration:
            $ref: "#/$defs/registration_params"
          enhance_contrast:
            $ref: "#/$defs/enhance_contrast_params"
          hist_equalize:
            $ref: "#/$defs/hist_equalize_params"
          morph_recon:
            $ref: "#/$defs/morph_recon_params"
          tophat:
            $ref: "#/$defs/tophat_params"
          global_registration:
            $ref: "#/$defs/global_registration_params"
          create_subtiles:
