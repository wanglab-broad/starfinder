# Python workflow on Broad UGER; the head runs in the same image as its jobs.
executor: cluster-generic
cluster-generic-submit-cmd: broad-submit.py
cluster-generic-status-cmd: broad-status.py
jobscript: broad-jobscript.sh
default-resources: [mem_mb=8000, runtime=30]
rerun-triggers: [mtime, params, input]

jobs: 1000
keep-going: true
local-cores: 1
latency-wait: 60
rerun-incomplete: true
retries: 2
immediate-submit: false
