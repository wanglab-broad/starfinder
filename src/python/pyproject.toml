[project]
name = "starfinder"
version = "0.1.0"
description = "Spatial transcriptomics data processing pipeline for STARmap"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jiahao Huang"}
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "tifffile>=2023.0",
    "pandas>=2.0",
    "h5py>=3.9",
    "matplotlib>=3.7",
    "bioio>=1.0",
    "bioio-tifffile>=1.0",
]

[project.optional-dependencies]
ome = ["bioio-ome-tiff>=1.0"]
local-registration = ["SimpleITK>=2.3"]
registration-elastix = ["itk-elastix==0.25.4", "itk==5.4.7"]
# Learned spot detectors (§2.7). torch has no cp314 wheel at 2.7.1, so the extras
# are empty on Python 3.14 and later.
spotiflow = [
    "spotiflow==0.6.5; python_version < '3.14'",
    "torch==2.7.1; python_version < '3.14'",
    "torchvision==0.22.1; python_version < '3.14'",
]
piscis = [
    "piscis==1.1.0; python_version < '3.14'",
    "torch==2.7.1; python_version < '3.14'",
    "torchvision==0.22.1; python_version < '3.14'",
]
# Segmentation backends (§2.9). TensorFlow 2.20.0 and torch 2.7.1 have no cp314
# wheels, so the extras are empty on Python 3.14 and later. keras 3.15.1, the
# version measured with TensorFlow 2.20.0, needs Python 3.11, so the stardist
# extra is also empty on Python 3.10.
stardist = [
    "stardist==0.9.2; python_version >= '3.11' and python_version < '3.14'",
    "csbdeep==0.8.2; python_version >= '3.11' and python_version < '3.14'",
    "tensorflow==2.20.0; python_version >= '3.11' and python_version < '3.14'",
]
cellpose = [
    "cellpose==4.2.1.1; python_version < '3.14'",
    "torch==2.7.1; python_version < '3.14'",
    "torchvision==0.22.1; python_version < '3.14'",
]
checkpoint = ["pyarrow>=15"]
spatialdata = ["spatialdata>=0.1", "spatialdata-io>=0.1"]
# AnnData alone, for the per-FOV `raw.h5ad` of the workflow (§2.9), at the versions
# the `spatialdata` extra already locks.
anndata = [
    "anndata==0.11.4; python_version < '3.11'",
    "anndata==0.12.6; python_version >= '3.11'",
]
visualization = ["napari>=0.4"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]

[project.scripts]
starfinder = "starfinder.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starfinder"]

[dependency-groups]
docs = [
    "sphinx>=8.1,<9",
    "myst-parser>=4,<5",
    "pydata-sphinx-theme>=0.16,<0.17",
    "sphinxcontrib-matlabdomain>=0.22,<0.23",
    "sphinx-design>=0.6,<0.7",
]
dev = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.3",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[tool.uv]
# huggingface-hub (pulled in by piscis) is held at the version W-266 measured;
# newer releases would also move the locked click and idna. keras and tensorboard
# are held at the versions W-305 and W-306 measured with TensorFlow 2.20.0.
constraint-dependencies = ["torch==2.7.1", "torchvision==0.22.1", "huggingface-hub==1.16.1",
                           "keras==3.15.1", "tensorboard==2.20.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-v --tb=short --strict-markers -m 'not extended'"
markers = [
    "extended: full-pipeline end-to-end comparisons on the session's synthetic data; run with -m extended",
    # Subsystem: the package whose behavior the test asserts. Every test has at least one (test/conftest.py).
    "core: starfinder.image, the method registry helper and execution settings",
    "io: starfinder.io readers, writers and OME-TIFF",
    "dataset: starfinder.dataset (Dataset, FOV, types, checkpoints)",
    "preprocessing: starfinder.preprocessing and its recipes",
    "registration: starfinder.registration and its recipes",
    "spot_finding: starfinder.spot_finding and its detectors",
    "barcode: starfinder.barcode (codebook, extraction, decoding, filtering)",
    "synthetic: starfinder.synthetic generation",
    "evaluation: starfinder.evaluation metrics",
    "benchmark: starfinder.benchmark and the scripts under benchmarks/",
    "workflow: workflow/ scripts and the MATLAB launcher",
    "integration: asserts behavior across three or more subsystems",
    # Cost and requirement.
    "slow: 5 s or more on one CPU and one thread, or shares a cached result that takes as long",
    "learned: needs torch and the downloaded detector weights (STARFINDER_WEIGHTS_DIR)",
    # Kind. A test without a kind marker is an ordinary unit test.
    "contract: interface, dtype, error, registry and workflow-key behavior",
    "golden: regression against pinned outputs",
    "validation: an engineering validation check of a design table in the docs (S and V series)",
    "e2e: full pipeline",
]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
