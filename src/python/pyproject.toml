[project]
name = "starfinder"
version = "0.1.0"
description = "Spatial transcriptomics data processing pipeline for STARmap"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jiahao Huang"}
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "tifffile>=2023.0",
    "pandas>=2.0",
    "h5py>=3.9",
    "matplotlib>=3.7",
    "bioio>=1.0",
    "bioio-tifffile>=1.0",
]

[project.optional-dependencies]
ome = ["bioio-ome-tiff>=1.0"]
local-registration = ["SimpleITK>=2.3"]
registration-elastix = ["itk-elastix==0.25.4", "itk==5.4.7"]
# Learned spot detectors (§2.7). torch has no cp314 wheel at 2.7.1, so the extras
# are empty on Python 3.14 and later.
spotiflow = [
    "spotiflow==0.6.5; python_version < '3.14'",
    "torch==2.7.1; python_version < '3.14'",
    "torchvision==0.22.1; python_version < '3.14'",
]
piscis = [
    "piscis==1.1.0; python_version < '3.14'",
    "torch==2.7.1; python_version < '3.14'",
    "torchvision==0.22.1; python_version < '3.14'",
]
checkpoint = ["pyarrow>=15"]
spatialdata = ["spatialdata>=0.1", "spatialdata-io>=0.1"]
visualization = ["napari>=0.4"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]

[project.scripts]
starfinder = "starfinder.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starfinder"]

[dependency-groups]
docs = [
    "sphinx>=8.1,<9",
    "myst-parser>=4,<5",
    "pydata-sphinx-theme>=0.16,<0.17",
    "sphinxcontrib-matlabdomain>=0.22,<0.23",
    "sphinx-design>=0.6,<0.7",
]
dev = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.3",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[tool.uv]
# huggingface-hub (pulled in by piscis) is held at the version W-266 measured;
# newer releases would also move the locked click and idna.
constraint-dependencies = ["torch==2.7.1", "torchvision==0.22.1", "huggingface-hub==1.16.1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-v --tb=short -m 'not extended'"
markers = ["extended: full-pipeline end-to-end comparisons on the session's synthetic data; run with -m extended"]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
